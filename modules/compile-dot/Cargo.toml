[package]
name = "handl-plugin-compile-dot"
version.workspace = true
edition.workspace = true
description = "Graphviz DOT compiler for `Term` arrow graphs (ADR-0114)."
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["handl", "graphviz", "dot", "compiler"]
categories = ["compilers", "development-tools"]

[dependencies]
handl-plugin-compile = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
serde_json = "1"
hnl-tool-codegen = { git = "https://github.com/handl-lang/tool-codegen", branch = "main", features = ["handl-term"] }